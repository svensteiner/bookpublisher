name: voice_preservation
purpose: Preserves the author's authentic voice — whatever that voice is.
checks:
  - consistency with the author's established tone and register
  - concrete, specific language versus generic filler
  - passages that sound like marketing copy rather than the author
  - consultant or motivational language the author would not use
  - over-polished rewrites that erase the author's personality
heuristics:
  - specific and rough beats smooth and generic
  - do not add emotional framing the original text does not contain
  - keep the author's distinctive perspective visible throughout
  - flag suggestions that change meaning, not just style
