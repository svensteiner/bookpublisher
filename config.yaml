agent_name: bookpublisher
agent_version: 1.0.0

default_input_path: ""

default_model: claude-sonnet-4-6
fallback_model: claude-haiku-4-5-20251001
temperature: 0.2
max_manuscript_chars: 60000

# Retry transient API errors on the primary model before dropping to
# the fallback model. 2 = one extra retry per model (so the primary
# gets two chances before Haiku takes over). Exponential backoff
# uses llm_retry_backoff_seconds as the base delay (0.5s, 1s, ...).
llm_retry_attempts: 2
llm_retry_backoff_seconds: 0.5

# First-N%-Deep-Scan tuning. The default 10%/14% matches Amazon's
# Kindle-Sample window. Short nonfiction (<25k words) should raise
# `sample_scan_ratio` to ~0.20 and lower `sample_scan_min_section_words`
# to ~50 so the scan still produces 4-6 sections.
sample_scan_ratio: 0.10
sample_scan_max_ratio: 0.14
sample_scan_max_sections: 8
sample_scan_section_target_words: 350
sample_scan_min_section_words: 90

read_only: true
artifact_mirror_single_project: true
skills_directory: skills
memory_path: artifacts/agent_memory.json

skip_directories:
  - artifacts
  - logs
  - tests
  - __pycache__
  - .git
  - .venv
  - venv
  - nicht_hochladen
  - redaktion
  - kundenausgabe

supplemental_text_directories:
  - nicht_hochladen
  - redaktion

supported_files:
  manuscripts:
    - .docx
  text:
    - .md
    - .txt
  pdf:
    - .pdf
  covers:
    - .png
    - .jpg
    - .jpeg
  archives:
    - .zip
