agent_name: bookpublisher
agent_version: 1.0.0

default_input_path: ""

default_model: claude-sonnet-4-6
fallback_model: claude-haiku-4-5-20251001
temperature: 0.2
max_manuscript_chars: 60000

# Retry transient API errors on the primary model before dropping to
# the fallback model. 2 = one extra retry per model (so the primary
# gets two chances before Haiku takes over). Exponential backoff
# uses llm_retry_backoff_seconds as the base delay (0.5s, 1s, ...).
llm_retry_attempts: 2
llm_retry_backoff_seconds: 0.5

# First-N%-Deep-Scan tuning. The default 10%/14% matches Amazon's
# Kindle-Sample window. Short nonfiction (<25k words) should raise
# `sample_scan_ratio` to ~0.20 and lower `sample_scan_min_section_words`
# to ~50 so the scan still produces 4-6 sections.
sample_scan_ratio: 0.10
sample_scan_max_ratio: 0.14
sample_scan_max_sections: 8
sample_scan_section_target_words: 350
sample_scan_min_section_words: 90

# Chapter-balance outlier detection. SPLIT-flag at >median*oversized_factor,
# MERGE-flag at <median*undersized_factor. Lesson-style nonfiction with
# ~30 short chapters should set `oversized_factor: 2.0` and
# `undersized_factor: 0.5` so micro-lessons don't trigger false MERGE-flags.
balance_oversized_factor: 3.0
balance_undersized_factor: 0.3
balance_min_chapters: 3

# Number of competitive-positioning differentiation angles surfaced in
# beginner_summary.md. 1 = strongest angle only (default). Raise to 2-3
# when the book has multiple differentiation hooks that all need to
# land in the Amazon description.
beginner_summary_positioning_limit: 1

# Number of KDP keyword slots surfaced in beginner_summary.md. 3 = the
# canonical subject_audience + audience_format + anchor_pair spread.
# Raise to 5-7 for authors who want to copy-paste the full keyword set
# straight from the summary; KDP allows at most 7 keywords.
beginner_summary_kdp_keyword_limit: 3

# Number of weakest chapters surfaced in beginner_summary.md
# ("## Schwächste Kapitel"). 3 = canonical default that keeps the summary
# focused on the top fix-candidates. Lesson-style nonfiction with many
# short chapters (>20) can raise this to 5-7 so cluster-issues become
# visible. Clamped to [1, 10].
beginner_summary_weakest_limit: 3

# Number of weakest Kindle-Sample sections surfaced in beginner_summary.md.
# 1 = only the single highest drop-off risk (default — keeps the summary
# focused on the one passage where Kindle-readers most likely abandon).
# Raise to 2-3 for long nonfiction (>100k words) where the sample scan
# typically reports several FIX-flagged sections that hint at a cluster
# issue rather than a single weak passage. Clamped to [1, 10].
beginner_summary_weakest_sample_limit: 1

# Amstad-FRE readability target band for the QA gate. Default 50-80 fits
# popular German nonfiction (B1/B2 reading level).
#   * Fachbuch / akademisch: 30-55  (Wissenschaftssprache; dichte Saetze
#     sollen nicht als "zu schwer" markiert werden).
#   * Populaeres Sachbuch:   50-80  (Standard — passt zu KDP-Bestsellern).
#   * Lifestyle / Ratgeber:  60-90  (sehr leicht; Marker schlaegt aus,
#     sobald ein Kapitel zu akademisch wirkt).
# Values are clamped into [10, 100]. When min >= max, the loader falls
# back to the canonical 50/80 default so a typo cannot break the run.
readability_target_min: 50
readability_target_max: 80

# Optional LLM-Pass for the First-N%-Deep-Scan (Kindle-Sample). When
# enabled AND ANTHROPIC_API_KEY is set, every risky section (REVIEW/FIX)
# gets a concrete LLM-rewritten opening sentence in sample_scan.md. Off
# by default because the heuristic fix lines are already actionable and
# the LLM call only pays off once the deterministic gates are green.
# Any LLM failure falls back silently to the heuristic path.
sample_scan_llm_rewrites_enabled: false

# Optional LLM-Pass for the per-chapter analysis (chapter_review). When
# enabled AND ANTHROPIC_API_KEY is set, every weak chapter (status REVIEW
# or FIX) gets a concrete, manuscript-grounded LLM fix line in
# chapter_review.md/.json on top of the deterministic hint. Off by default
# because the heuristic fixes already ship without an API key; any LLM
# failure falls back silently to the heuristic path.
chapter_review_llm_fixes_enabled: false

# Optional matplotlib-backed PNG render of the score history. Off by
# default because matplotlib is not in the install set and would bloat
# the Windows EXE. Enable with `score_history_graph_enabled: true` and
# `pip install matplotlib` to get `artifacts/<project>/score_history.png`
# after every QA round.
score_history_graph_enabled: false

read_only: true
artifact_mirror_single_project: true
skills_directory: skills
memory_path: artifacts/agent_memory.json

skip_directories:
  - artifacts
  - logs
  - tests
  - __pycache__
  - .git
  - .venv
  - venv
  - nicht_hochladen
  - redaktion
  - kundenausgabe

supplemental_text_directories:
  - nicht_hochladen
  - redaktion

supported_files:
  manuscripts:
    - .docx
  text:
    - .md
    - .txt
  pdf:
    - .pdf
  covers:
    - .png
    - .jpg
    - .jpeg
  archives:
    - .zip
